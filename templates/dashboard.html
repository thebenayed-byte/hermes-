<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BenPopup</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .messages {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            background: #fafafa;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .status {
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <strong>💬 BenPopup</strong>

    <span style="float:right">

        {{ utilisateur.nom }}

        |

        <a
            href="/logout"
            style="color:white"
        >
            Déconnexion
        </a>

    </span>

</header>


<main>

    <div class="card">

        <h2>
            Bienvenue {{ utilisateur.nom }} 👋
        </h2>

        <p>
            Connexion :
            <strong>
                {{ utilisateur.provider }}
            </strong>
        </p>

        <p class="status">
            🟢 Serveur : EN LIGNE
        </p>

        <p>
            Clients :
            <strong>
                {{ clients }}
            </strong>
        </p>

    </div>


    <div class="card">

        <h2>💬 Messagerie</h2>

        <p id="statut">
            Connexion...
        </p>

        <div
            id="messages"
            class="messages"
        ></div>


        <input
            id="destinataire"
            placeholder="Nom du destinataire"
        >


        <input
            id="message"
            placeholder="Écrire un message..."
        >


        <button
            onclick="envoyer()"
        >
            📨 Envoyer
        </button>

    </div>

</main>


<script>

let socket = null;

let nomUtilisateur =
    "{{ utilisateur.nom }}";


async function connecter() {

    const response =
        await fetch(
            "/api/ws-token"
        );


    const data =
        await response.json();


    if (!data.connecte) {

        document.getElementById(
            "statut"
        ).innerText =
            "🔴 Non connecté";

        return;
    }


    socket =
        new WebSocket(
            "wss://" +
            window.location.host +
            "/ws"
        );


    socket.onopen = function() {

        document.getElementById(
            "statut"
        ).innerText =
            "🟢 Connecté";


        socket.send(
            JSON.stringify({

                type:
                    "connexion",

                token:
                    data.token

            })
        );
    };


    socket.onmessage =
        function(event) {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.type ===
                "message"
            ) {

                ajouterMessage(
                    "💬 " +
                    data.expediteur +
                    " : " +
                    data.message
                );
            }


            else if (
                data.type ===
                "erreur"
            ) {

                ajouterMessage(
                    "⚠️ " +
                    data.message
                );
            }


            else if (
                data.type ===
                "connexion_ok"
            ) {

                nomUtilisateur =
                    data.nom;

                ajouterMessage(
                    "🟢 Connecté en tant que " +
                    data.nom
                );
            }

        };


    socket.onclose =
        function() {

            document.getElementById(
                "statut"
            ).innerText =
                "🔴 Déconnecté";
        };


    socket.onerror =
        function() {

            document.getElementById(
                "statut"
            ).innerText =
                "🔴 Erreur";
        };

}


function envoyer() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "Vous n'êtes pas connecté."
        );

        return;
    }


    const destinataire =
        document.getElementById(
            "destinataire"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        ).value.trim();


    if (!destinataire) {

        alert(
            "Indique le destinataire."
        );

        return;
    }


    if (!message) {

        return;
    }


    socket.send(
        JSON.stringify({

            type:
                "message",

            destinataire:
                destinataire,

            message:
                message

        })
    );


    ajouterMessage(
        "🟢 Moi → " +
        destinataire +
        " : " +
        message
    );


    document.getElementById(
        "message"
    ).value = "";

}


function ajouterMessage(
    texte
) {

    const zone =
        document.getElementById(
            "messages"
        );


    const ligne =
        document.createElement(
            "div"
        );


    ligne.style.marginBottom =
        "10px";


    ligne.textContent =
        texte;


    zone.appendChild(
        ligne
    );


    zone.scrollTop =
        zone.scrollHeight;

}


connecter();

</script>

</body>

</html>
