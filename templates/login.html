<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - BenPopup</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .box {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .btn {
            display: block;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .google {
            background: #4285F4;
        }

        .facebook {
            background: #1877F2;
        }

        .back {
            display: block;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>💬 BenPopup</h1>

    <p>
        Connecte-toi pour accéder à ton compte.
    </p>


    {% if google_active %}

    <a
        class="btn google"
        href="/auth/google"
    >
        🔵 Continuer avec Google
    </a>

    {% endif %}


    {% if facebook_active %}

    <a
        class="btn facebook"
        href="/auth/facebook"
    >
        🔵 Continuer avec Facebook
    </a>

    {% endif %}


    {% if not google_active and not facebook_active %}

    <p>
        Aucun système de connexion n'est configuré.
    </p>

    {% endif %}


    <a
        class="back"
        href="/"
    >
        Retour
    </a>

</div>

</body>

</html>
